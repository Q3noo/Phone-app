name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build the APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Notelet.apk

      - name: Check the APK has no internet access
        run: |
          set -o pipefail
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$AAPT2" dump permissions Notelet.apk | tee permissions.txt
          # Fail rather than pass by accident if the permissions couldn't be read.
          if ! grep -q "^package: app.notelet$" permissions.txt; then
            echo "::error::Could not read the APK's permissions."
            exit 1
          fi
          if grep -E "android\.permission\.(INTERNET|ACCESS_NETWORK_STATE)" permissions.txt; then
            echo "::error::The APK asks for network access. It must stay offline."
            exit 1
          fi
          echo "OK: no network permissions in the APK."

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: Notelet-apk
          path: Notelet.apk

      # Builds of the main branch also go to a "latest" release, which gives a
      # stable download link you can open on your phone.
      - name: Publish as the "latest" release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Notelet.apk \
            --title "Notelet (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. On your phone, download Notelet.apk and open it to install or update." \
            --prerelease \
            --target "$GITHUB_SHA"
